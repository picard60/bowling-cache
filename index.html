<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Geocaching Bowling</title>
  <style>
    * {
      touch-action: none;
      box-sizing: border-box;
    }
    body {
      margin: 0;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #050508;
      color: #fff;
      user-select: none;
      -webkit-user-select: none;
    }
    #ui {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      width: 95%;
      max-width: 600px;
      pointer-events: none;
    }
    #score-board {
      background: rgba(10, 10, 15, 0.9);
      padding: 10px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 4px 20px rgba(0,0,0,0.8);
      text-align: center;
    }
    .status-line {
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 6px;
      color: #ffbe0b;
    }
    .frames-container {
      display: flex;
      justify-content: space-between;
      gap: 2px;
    }
    .frame-box {
      flex: 1;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 4px;
      font-size: 11px;
      padding: 2px 1px;
    }
    .frame-box.active {
      border-color: #ffbe0b;
      background: rgba(255, 190, 11, 0.15);
    }
    .frame-title {
      font-size: 9px;
      color: #aaa;
    }
    .frame-rolls {
      font-weight: bold;
      height: 14px;
      color: #fff;
    }
    .frame-score {
      font-size: 10px;
      color: #4E9F3D;
      font-weight: bold;
      margin-top: 2px;
    }
    #instructions {
      position: absolute;
      bottom: 12px;
      width: 100%;
      text-align: center;
      font-size: 12px;
      color: #ccc;
      pointer-events: none;
      text-shadow: 0 2px 4px rgba(0,0,0,0.9);
      padding: 0 10px;
    }
    #message-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(10, 10, 15, 0.95);
      padding: 25px;
      border-radius: 16px;
      border: 2px solid #ffbe0b;
      box-shadow: 0 0 35px rgba(255, 190, 11, 0.4);
      display: none;
      text-align: center;
      z-index: 20;
      width: 85%;
      max-width: 400px;
    }
    #message-title {
      font-size: 22px;
      font-weight: 900;
      color: #ffbe0b;
      margin-bottom: 12px;
    }
    #coords-box {
      font-size: 20px;
      font-weight: bold;
      color: #4E9F3D;
      background: #000;
      padding: 12px;
      border-radius: 8px;
      margin: 15px 0;
      font-family: monospace;
      letter-spacing: 2px;
      border: 1px dashed #4E9F3D;
      word-break: break-all;
    }
    .btn-retry {
      background: #ffbe0b;
      color: #000;
      border: none;
      padding: 12px 24px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
    }
    .btn-retry:hover { background: #e0a800; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="ui">
    <div id="score-board">
      <div class="status-line">Carreau <span id="current-frame-num">1</span>/10 — Total : <span id="total-score">0</span> pts</div>
      <div class="frames-container" id="frames-grid"></div>
    </div>
  </div>
  
  <div id="message-overlay">
    <div id="message-title">BRAVO vous avez gagné</div>
    <div id="message-text">Le code à rentrer dans certitude est :</div>
    <div id="coords-box">STRIKEANDSPARE</div>
    <button class="btn-retry" onclick="resetGame()">Rejouer</button>
  </div>
  
  <div id="instructions">
    Glisse pour placer la boule. <b>Maintiens, tire vers LE HAUT puis relâche</b> pour lancer !
  </div>

  <script>
    // --- Initialisation Moteur 3D ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x060609);

    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 3.8, 12);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    // --- Lumières ---
    scene.add(new THREE.AmbientLight(0xffffff, 0.4));

    const spotLight = new THREE.SpotLight(0xfff0dd, 1.2);
    spotLight.position.set(0, 18, 8);
    spotLight.angle = Math.PI / 4;
    spotLight.penumbra = 0.5;
    spotLight.castShadow = true;
    spotLight.shadow.mapSize.width = 1024;
    spotLight.shadow.mapSize.height = 1024;
    scene.add(spotLight);

    const pinNeons = new THREE.PointLight(0x00d2ff, 1.5, 12);
    pinNeons.position.set(0, 3.5, -18);
    scene.add(pinNeons);

    // --- Texture Piste avec Texte GEOCACHING ---
    function generateLaneTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 2048;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = '#c78d4c';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const planks = 39;
      const pWidth = canvas.width / planks;
      for (let i = 0; i < planks; i++) {
        ctx.fillStyle = (i % 2 === 0) ? 'rgba(0,0,0,0.04)' : 'rgba(255,255,255,0.03)';
        ctx.fillRect(i * pWidth, 0, pWidth, canvas.height);
        ctx.fillStyle = 'rgba(60, 30, 5, 0.12)';
        ctx.fillRect(i * pWidth, 0, 1, canvas.height);
      }

      ctx.fillStyle = '#d90429';
      ctx.fillRect(0, canvas.height - 250, canvas.width, 14);

      // Écriture du texte GEOCACHING sur la piste
      ctx.save();
      ctx.translate(canvas.width / 2, canvas.height - 1100);
      ctx.font = '900 64px "Segoe UI", Arial, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = 'rgba(40, 20, 5, 0.6)';
      ctx.letterSpacing = "10px";
      ctx.fillText('GEOCACHING', 0, 0);
      ctx.restore();

      const arrowY = canvas.height - 700;
      ctx.fillStyle = '#3a1e05';
      for (let i = -3; i <= 3; i++) {
        const x = canvas.width / 2 + i * (pWidth * 5);
        ctx.beginPath();
        ctx.moveTo(x, arrowY);
        ctx.lineTo(x - 10, arrowY + 30);
        ctx.lineTo(x + 10, arrowY + 30);
        ctx.closePath();
        ctx.fill();
      }

      const tex = new THREE.CanvasTexture(canvas);
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
      return tex;
    }

    const laneWidth = 4.0;
    const laneLength = 30;
    const lane = new THREE.Mesh(
      new THREE.BoxGeometry(laneWidth, 0.2, laneLength),
      new THREE.MeshStandardMaterial({ map: generateLaneTexture(), roughness: 0.1, metalness: 0.2 })
    );
    lane.position.set(0, -0.1, -6);
    lane.receiveShadow = true;
    scene.add(lane);

    const gutterMat = new THREE.MeshStandardMaterial({ color: 0x0f0f14, roughness: 0.6 });
    [-1, 1].forEach(side => {
      const g = new THREE.Mesh(new THREE.BoxGeometry(1.0, 0.15, laneLength), gutterMat);
      g.position.set(side * (laneWidth / 2 + 0.5), -0.12, -6);
      scene.add(g);
    });

    // --- Texture Boule aux Couleurs Geocaching ---
    function generateGeocachingBallTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 256;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = '#4E9F3D'; ctx.fillRect(0, 0, 256, 128);       // Vert (haut-gauche)
      ctx.fillStyle = '#F26522'; ctx.fillRect(256, 0, 256, 128);     // Orange (haut-droite)
      ctx.fillStyle = '#0082C8'; ctx.fillRect(0, 128, 256, 128);     // Bleu (bas-gauche)
      ctx.fillStyle = '#FFB800'; ctx.fillRect(256, 128, 256, 128);   // Jaune (bas-droite)

      return new THREE.CanvasTexture(canvas);
    }

    // --- Meshes Quille & Boule ---
    function createPinMesh() {
      const points = [
        new THREE.Vector2(0.22, 0), new THREE.Vector2(0.25, 0.2),
        new THREE.Vector2(0.22, 0.4), new THREE.Vector2(0.12, 0.75),
        new THREE.Vector2(0.13, 0.95), new THREE.Vector2(0.08, 1.15),
        new THREE.Vector2(0, 1.2)
      ];
      const pinGeo = new THREE.LatheGeometry(points, 24);

      const canvas = document.createElement('canvas');
      canvas.width = 128; canvas.height = 256;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, 128, 256);
      ctx.fillStyle = '#d90429'; ctx.fillRect(0, 60, 128, 14); ctx.fillRect(0, 82, 128, 14);

      const pinMat = new THREE.MeshStandardMaterial({ 
        map: new THREE.CanvasTexture(canvas), roughness: 0.15, metalness: 0.05 
      });

      const mesh = new THREE.Mesh(pinGeo, pinMat);
      mesh.castShadow = true;
      return mesh;
    }

    const ballRadius = 0.41;
    const ballGroup = new THREE.Group();
    const ballSphere = new THREE.Mesh(
      new THREE.SphereGeometry(ballRadius, 32, 32),
      new THREE.MeshStandardMaterial({ map: generateGeocachingBallTexture(), roughness: 0.1, metalness: 0.3 })
    );
    ballSphere.castShadow = true;
    ballGroup.add(ballSphere);

    const holeGeo = new THREE.CylinderGeometry(0.035, 0.035, 0.18, 16);
    const holeMat = new THREE.MeshBasicMaterial({ color: 0x050505 });
    [{ x: -0.07, y: 0.35, z: 0.18 }, { x: 0.07, y: 0.35, z: 0.18 }, { x: 0, y: 0.26, z: 0.31 }].forEach(opt => {
      const h = new THREE.Mesh(holeGeo, holeMat);
      h.position.set(opt.x, opt.y, opt.z);
      h.rotation.x = Math.PI / 3;
      ballGroup.add(h);
    });
    scene.add(ballGroup);

    // --- Trait de Visée ---
    const lineMat = new THREE.LineDashedMaterial({ color: 0xffffff, dashSize: 0.5, gapSize: 0.25, opacity: 0.8, transparent: true });
    const aimLine = new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,0,0), new THREE.Vector3(0,0,-25)]), lineMat);
    aimLine.computeLineDistances();
    scene.add(aimLine);

    function updateAimLine(dirX) {
      if (isMoving || isWaiting || isGameEnded) { aimLine.visible = false; return; }
      aimLine.visible = true;
      aimLine.position.set(ballGroup.position.x, 0.05, ballGroup.position.z);
      const positions = aimLine.geometry.attributes.position.array;
      positions[3] = dirX * 25 * 3;
      positions[5] = -25;
      aimLine.geometry.attributes.position.needsUpdate = true;
      aimLine.computeLineDistances();
    }

    // --- Quilles & Disposition ---
    const pins = [];
    function setupPins(standingPinsMask = null) {
      pins.forEach(p => scene.remove(p.mesh));
      pins.length = 0;

      const rows = 4;
      let startZ = -18;
      let spacingX = 0.70;
      let spacingZ = 0.76;
      let index = 0;

      for (let i = 0; i < rows; i++) {
        for (let j = 0; j <= i; j++) {
          const x = (j - i / 2) * spacingX;
          const z = startZ - i * spacingZ;

          if (!standingPinsMask || standingPinsMask[index]) {
            const mesh = createPinMesh();
            mesh.position.set(x, 0, z);
            scene.add(mesh);
            pins.push({ id: index, mesh: mesh, isFallen: false, vel: new THREE.Vector3(), rotVel: new THREE.Vector3() });
          }
          index++;
        }
      }
    }

    // --- Logique du Bowling ---
    let rolls = [];
    let currentFrame = 0;
    let rollInFrame = 0;
    let standingPinsMask = Array(10).fill(true);

    let ballVel = new THREE.Vector3();
    let isMoving = false;
    let isWaiting = false;
    let isGameEnded = false;

    let isDragging = false;
    let dragStart = { x: 0, y: 0 };
    let dragCurrent = { x: 0, y: 0 };
    let currentDirX = 0;

    function initUI() {
      const grid = document.getElementById('frames-grid');
      grid.innerHTML = '';
      for (let i = 0; i < 10; i++) {
        const box = document.createElement('div');
        box.className = `frame-box ${i === 0 ? 'active' : ''}`;
        box.id = `frame-${i}`;
        box.innerHTML = `
          <div class="frame-title">${i + 1}</div>
          <div class="frame-rolls" id="rolls-${i}">-</div>
          <div class="frame-score" id="score-${i}"></div>
        `;
        grid.appendChild(box);
      }
    }

    function calculateScores() {
      let total = 0;
      let rollIndex = 0;
      const frameScores = [];

      for (let frame = 0; frame < 10; frame++) {
        if (frame < 9) {
          if (rolls[rollIndex] === 10) { // Strike
            const b1 = rolls[rollIndex + 1] || 0;
            const b2 = rolls[rollIndex + 2] || 0;
            if (rolls[rollIndex + 1] !== undefined && rolls[rollIndex + 2] !== undefined) {
              total += 10 + b1 + b2;
              frameScores.push(total);
            } else frameScores.push(null);
            rollIndex++;
          } else if (rolls[rollIndex] + rolls[rollIndex + 1] === 10) { // Spare
            const b1 = rolls[rollIndex + 2] || 0;
            if (rolls[rollIndex + 2] !== undefined) {
              total += 10 + b1;
              frameScores.push(total);
            } else frameScores.push(null);
            rollIndex += 2;
          } else { // Normal
            if (rolls[rollIndex] !== undefined && rolls[rollIndex + 1] !== undefined) {
              total += rolls[rollIndex] + rolls[rollIndex + 1];
              frameScores.push(total);
            } else frameScores.push(null);
            rollIndex += 2;
          }
        } else {
          // Frame 10
          if (rolls[rollIndex] !== undefined && rolls[rollIndex + 1] !== undefined) {
            let frameTotal = rolls[rollIndex] + rolls[rollIndex + 1];
            if (frameTotal >= 10) {
              if (rolls[rollIndex + 2] !== undefined) {
                total += frameTotal + rolls[rollIndex + 2];
                frameScores.push(total);
              } else frameScores.push(null);
            } else {
              total += frameTotal;
              frameScores.push(total);
            }
          } else frameScores.push(null);
        }
      }

      return { total, frameScores };
    }

    function updateScoreBoard() {
      const { total, frameScores } = calculateScores();
      document.getElementById('total-score').innerText = total;
      document.getElementById('current-frame-num').innerText = Math.min(currentFrame + 1, 10);

      let rIndex = 0;
      for (let f = 0; f < 10; f++) {
        const box = document.getElementById(`frame-${f}`);
        const rollsEl = document.getElementById(`rolls-${f}`);
        const scoreEl = document.getElementById(`score-${f}`);

        if (box) box.classList.toggle('active', f === currentFrame && !isGameEnded);

        if (f < 9) {
          const r1 = rolls[rIndex];
          const r2 = rolls[rIndex + 1];

          if (r1 === 10) {
            rollsEl.innerText = 'X';
            rIndex++;
          } else if (r1 !== undefined && r2 !== undefined) {
            rollsEl.innerText = (r1 + r2 === 10) ? `${r1} /` : `${r1} ${r2}`;
            rIndex += 2;
          } else if (r1 !== undefined) {
            rollsEl.innerText = `${r1}`;
            rIndex++;
          } else {
            rollsEl.innerText = '-';
          }
        } else {
          const r1 = rolls[rIndex];
          const r2 = rolls[rIndex + 1];
          const r3 = rolls[rIndex + 2];
          let txt = '';

          if (r1 !== undefined) txt += (r1 === 10) ? 'X ' : `${r1} `;
          if (r2 !== undefined) {
            if (r1 !== 10 && r1 + r2 === 10) txt += '/ ';
            else txt += (r2 === 10) ? 'X ' : `${r2} `;
          }
          if (r3 !== undefined) txt += (r3 === 10) ? 'X' : `${r3}`;

          rollsEl.innerText = txt.trim() || '-';
        }

        if (scoreEl) scoreEl.innerText = frameScores[f] !== null && frameScores[f] !== undefined ? frameScores[f] : '';
      }
    }

    function resetBall() {
      ballGroup.position.set(0, ballRadius, 7);
      ballGroup.rotation.set(0, 0, 0);
      ballVel.set(0, 0, 0);
      isMoving = false;
      currentDirX = 0;
      camera.position.set(0, 3.8, 12);
      camera.lookAt(0, 0, -10);
      updateAimLine(0);
    }

    function resetGame() {
      rolls = [];
      currentFrame = 0;
      rollInFrame = 0;
      standingPinsMask = Array(10).fill(true);
      isGameEnded = false;
      isWaiting = false;

      document.getElementById('message-overlay').style.display = 'none';
      initUI();
      setupPins();
      resetBall();
      updateScoreBoard();
    }

    function handleEndShot() {
      isWaiting = true;
      const newlyFallen = pins.filter(p => p.isFallen).length;

      rolls.push(newlyFallen);

      if (currentFrame < 9) {
        if (rollInFrame === 0) {
          if (newlyFallen === 10) { // Strike
            currentFrame++;
            standingPinsMask = Array(10).fill(true);
            setTimeout(() => { setupPins(); resetBall(); isWaiting = false; updateScoreBoard(); }, 1200);
          } else {
            rollInFrame = 1;
            pins.forEach(p => { if (p.isFallen) standingPinsMask[p.id] = false; });
            setTimeout(() => { setupPins(standingPinsMask); resetBall(); isWaiting = false; updateScoreBoard(); }, 1200);
          }
        } else {
          currentFrame++;
          rollInFrame = 0;
          standingPinsMask = Array(10).fill(true);
          setTimeout(() => { setupPins(); resetBall(); isWaiting = false; updateScoreBoard(); }, 1200);
        }
      } else {
        if (rollInFrame === 0) {
          rollInFrame = 1;
          if (newlyFallen === 10) standingPinsMask = Array(10).fill(true);
          else pins.forEach(p => { if (p.isFallen) standingPinsMask[p.id] = false; });
          setTimeout(() => { setupPins(standingPinsMask); resetBall(); isWaiting = false; updateScoreBoard(); }, 1200);
        } else if (rollInFrame === 1) {
          const prevRoll = rolls[rolls.length - 2];
          if (prevRoll === 10 || prevRoll + newlyFallen === 10 || (prevRoll < 10 && newlyFallen === 10)) {
            rollInFrame = 2;
            if (newlyFallen === 10 || prevRoll + newlyFallen === 10) standingPinsMask = Array(10).fill(true);
            else pins.forEach(p => { if (p.isFallen) standingPinsMask[p.id] = false; });
            setTimeout(() => { setupPins(standingPinsMask); resetBall(); isWaiting = false; updateScoreBoard(); }, 1200);
          } else {
            endGame();
          }
        } else {
          endGame();
        }
      }
      updateScoreBoard();
    }

    function endGame() {
      isGameEnded = true;
      const { total } = calculateScores();
      const overlay = document.getElementById('message-overlay');
      const title = document.getElementById('message-title');
      const text = document.getElementById('message-text');
      const box = document.getElementById('coords-box');

      if (total >= 150) {
        title.innerText = "BRAVO vous avez gagné";
        text.innerText = "Le code à rentrer dans certitude est :";
        box.innerText = "STRIKEANDSPARE";
        box.style.display = "block";
      } else {
        title.innerText = "Partie terminée !";
        text.innerText = `Vous avez obtenu ${total} points. Il faut au moins 150 points pour obtenir le code.`;
        box.style.display = "none";
      }
      overlay.style.display = 'block';
    }

    // --- Interaction Joueur ---
    function getPointerPos(e) {
      if (e.touches && e.touches.length > 0) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
      return { x: e.clientX, y: e.clientY };
    }

    function handlePointerMove(e) {
      const pos = getPointerPos(e);
      const normalizedX = (pos.x / window.innerWidth) * 2 - 1;

      if (!isMoving && !isWaiting && !isGameEnded && !isDragging) {
        const targetX = normalizedX * (laneWidth / 2 - ballRadius);
        ballGroup.position.x = THREE.MathUtils.clamp(targetX, -laneWidth / 2 + ballRadius, laneWidth / 2 - ballRadius);
        updateAimLine(currentDirX);
      }

      if (isDragging) {
        dragCurrent = pos;
        const deltaX = dragStart.x - dragCurrent.x;
        currentDirX = THREE.MathUtils.clamp(deltaX * 0.0028, -0.22, 0.22);
        updateAimLine(currentDirX);
      }
    }

    function handlePointerStart(e) {
      if (isMoving || isWaiting || isGameEnded) return;
      isDragging = true;
      const pos = getPointerPos(e);
      dragStart = pos;
      dragCurrent = pos;
    }

    function handlePointerEnd() {
      if (!isDragging || isMoving) return;
      isDragging = false;

      const deltaX = dragStart.x - dragCurrent.x;
      const deltaY = dragStart.y - dragCurrent.y;

      if (deltaY > 15) {
        const speed = THREE.MathUtils.clamp(deltaY * 0.009, 0.45, 0.9);
        const dirX = THREE.MathUtils.clamp(deltaX * 0.0028, -0.22, 0.22);
        ballVel.set(dirX, 0, -speed);
        isMoving = true;
        aimLine.visible = false;
      }
    }

    window.addEventListener('mousemove', handlePointerMove);
    window.addEventListener('mousedown', handlePointerStart);
    window.addEventListener('mouseup', handlePointerEnd);

    window.addEventListener('touchmove', handlePointerMove, { passive: false });
    window.addEventListener('touchstart', handlePointerStart, { passive: false });
    window.addEventListener('touchend', handlePointerEnd);

    // --- Loop Moteur ---
    function animate() {
      requestAnimationFrame(animate);

      if (isMoving) {
        ballGroup.position.add(ballVel);
        ballGroup.rotation.x -= ballVel.z * 1.5;
        ballGroup.rotation.z += ballVel.x * 1.5;

        if (Math.abs(ballGroup.position.x) > laneWidth / 2 - ballRadius / 2) {
          ballVel.x = 0;
          ballGroup.position.y = -0.02;
        }

        if (ballGroup.position.z > -10) camera.position.z = ballGroup.position.z + 5.5;

        pins.forEach(pin => {
          if (!pin.isFallen) {
            if (ballGroup.position.distanceTo(pin.mesh.position) < ballRadius + 0.34) {
              pin.isFallen = true;
              const pushDir = new THREE.Vector3().subVectors(pin.mesh.position, ballGroup.position).normalize();
              pin.vel.copy(pushDir.multiplyScalar(0.35));
              pin.rotVel.set((Math.random() - 0.5) * 0.4, 0, (Math.random() - 0.5) * 0.4);
            }
          } else {
            if (pin.mesh.position.y < 0.1) pin.mesh.position.y += 0.02;
            pin.mesh.position.add(pin.vel);
            pin.mesh.rotation.x += pin.rotVel.x;
            pin.mesh.rotation.z += pin.rotVel.z;
            pin.vel.multiplyScalar(0.90);

            pins.forEach(otherPin => {
              if (!otherPin.isFallen && pin.mesh.position.distanceTo(otherPin.mesh.position) < 0.64) {
                otherPin.isFallen = true;
                const dominoDir = new THREE.Vector3().subVectors(otherPin.mesh.position, pin.mesh.position).normalize();
                otherPin.vel.copy(dominoDir.multiplyScalar(0.32));
                otherPin.rotVel.set((Math.random() - 0.5) * 0.35, 0, (Math.random() - 0.5) * 0.35);
              }
            });
          }
        });

        if (ballGroup.position.z < -22) {
          isMoving = false;
          handleEndShot();
        }
      } else if (!isWaiting && !isGameEnded) {
        camera.lookAt(ballGroup.position.x * 0.2, 0, -10);
      }

      renderer.render(scene, camera);
    }

    resetGame();
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
